name: CI - Test & Build Verification

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Linters, Tests & JVM Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Static Analysis & Linters (Ktlint & Detekt)
        run: ./gradlew ktlintCheck detekt --no-daemon

      - name: Run Shared & Disk Core Unit Tests
        run: ./gradlew :disk-core:jvmTest :shared:jvmTest --no-daemon

      - name: Verify Desktop Compilation
        run: ./gradlew :desktopApp:classes --no-daemon

  native-workers:
    name: Verify Native Worker (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: :worker-cli:linkDebugExecutableLinuxX64
          - os: windows-latest
            task: :worker-cli:linkDebugExecutableMingwX64
          - os: macos-latest
            task: :worker-cli:linkDebugExecutableMacosArm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build Native Worker Executable
        run: ./gradlew ${{ matrix.task }} --no-daemon
